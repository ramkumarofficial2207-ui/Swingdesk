# Minor and patch updates arrive as one grouped PR per ecosystem each week.
# Major versions are not proposed automatically: they are planned upgrades
# done on a chore/upgrade-* branch with migration notes and app testing.
# Security updates are still raised for any version.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /apex-intelligence
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ["*"]
