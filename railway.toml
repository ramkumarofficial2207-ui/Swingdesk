# Railway deployment config
[build]
builder = "DOCKERFILE"

[deploy]
healthcheckPath = "/api/ready"
healthcheckTimeout = 100
preDeployCommand = ["sh -c 'if command -v npx >/dev/null 2>&1; then exec npx prisma migrate deploy; fi'"]
startCommand = "sh -c 'if command -v uvicorn >/dev/null 2>&1 && [ -f /app/service.py ]; then exec uvicorn service:app --host 0.0.0.0 --port ${PORT:-8000}; else exec npm start; fi'"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
